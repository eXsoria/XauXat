name: XauXat voice release diagnostic

on:
  push:
    branches: [codex/testflight-354-voice]

permissions:
  contents: read

jobs:
  voice-recording:
    name: Voice recording on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash scripts/ios/test-voice-recording.sh
        env:
          VOICE_TEST_OUTPUT: ${{ runner.temp }}/voice-recording-proof
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: XauXat-voice-AppleSilicon-${{ github.sha }}
          path: ${{ runner.temp }}/voice-recording-proof
          if-no-files-found: error
          retention-days: 7
