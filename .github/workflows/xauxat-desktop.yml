name: XauXat Desktop
on:
  pull_request:
    paths: ['apps/multiplatform/**', 'scripts/desktop/**', 'scripts/xauxat/*desktop*', '.github/workflows/xauxat-desktop.yml']
  push:
    branches: [xauxat/main]
    paths: ['apps/multiplatform/**', 'scripts/desktop/**', 'scripts/xauxat/*desktop*', '.github/workflows/xauxat-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xauxat-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Desktop JVM checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: corretto
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Check XauXat packaging identity and isolation
        shell: bash
        run: python3 scripts/xauxat/verify-desktop-identity.py
      - name: Compile actual Desktop UI and run JVM tests
        shell: bash
        working-directory: apps/multiplatform
        run: ./gradlew --no-daemon --stacktrace :common:desktopTest :desktop:compileKotlinJvm -x :desktop:cmakeBuildAndCopy
