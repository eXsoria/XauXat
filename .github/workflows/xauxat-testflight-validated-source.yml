name: XauXat TestFlight validated source

on:
  workflow_dispatch:
    inputs:
      native_core_run_id:
        description: Successful iOS workflow run on the merged PR whose entire tested tree matches the release source
        required: true
        type: string
      merged_pr_number:
        description: Merged PR containing the already validated release source
        required: true
        type: string
      build_number:
        description: Unused TestFlight build number (greater than the last uploaded build)
        required: true
        default: '358'
        type: string
      upload:
        description: Upload the verified IPA to App Store Connect
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: xauxat-testflight
  cancel-in-progress: false

jobs:
  distribution:
    name: Sign and verify TestFlight IPA
    if: github.ref == 'refs/heads/xauxat/main'
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      XAUXAT_DEVELOPMENT_TEAM: ${{ vars.XAUXAT_DEVELOPMENT_TEAM }}
      XAUXAT_MANUAL_SIGNING: '1'
      XAUXAT_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Verify merged source and all equivalent-tree checks
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_CORE_RUN_ID: ${{ inputs.native_core_run_id }}
          MERGED_PR_NUMBER: ${{ inputs.merged_pr_number }}
        run: |
          set -euo pipefail
          python3 - <<'PYPROOF'
          import json, os, re, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/' + path], text=True))
          rid, number = os.environ['NATIVE_CORE_RUN_ID'], os.environ['MERGED_PR_NUMBER']
          assert rid.isdigit() and number.isdigit() and os.environ['XAUXAT_BUILD_NUMBER'].isdigit()
          assert re.fullmatch(r'[A-Z0-9]{10}', os.environ['XAUXAT_DEVELOPMENT_TEAM'])
          pr = api('pulls/' + number)
          assert pr['merged'] and pr['base']['ref'] == 'xauxat/main'
          assert pr['head']['repo']['full_name'] == repo, 'Only this repository can supply validated source'
          source = pr['merge_commit_sha']
          run = api('actions/runs/' + rid)
          assert run['path'] == '.github/workflows/xauxat-ios.yml' and run['event'] == 'pull_request'
          assert run['head_sha'] == pr['head']['sha'] and run['status'] == 'completed' and run['conclusion'] == 'success'
          artifacts = api('actions/runs/' + rid + '/artifacts')['artifacts']
          cores = [a for a in artifacts if a['name'].startswith('XauXat-iOS-Native-Core-') and not a['expired']]
          assert len(cores) == 1
          core = cores[0]
          tested = core['name'].removeprefix('XauXat-iOS-Native-Core-')
          assert re.fullmatch('[0-9a-f]{40}', tested)
          tree = api('git/commits/' + source)['tree']['sha']
          assert api('git/commits/' + tested)['tree']['sha'] == tree, 'Every tested repository byte must match the merged source'
          changes = api('compare/' + source + '...' + os.environ['GITHUB_SHA'])
          allowed = '.github/workflows/xauxat-testflight-validated-source.yml'
          assert changes['status'] in ('identical', 'ahead')
          assert all(f['filename'] == allowed for f in changes.get('files', [])), 'Application or test code changed after validation'
          assert api('git/ref/heads/xauxat/main')['object']['sha'] == os.environ['GITHUB_SHA']
          suite = api('actions/runs?head_sha=' + run['head_sha'] + '&event=pull_request&per_page=100')['workflow_runs']
          wanted = {'XauXat iOS', 'XauXat Tor recovery', 'XauXat support'}
          latest = {}
          for r in sorted(suite, key=lambda r:r['id']):
              if r['name'] in wanted: latest[r['name']] = r
          assert set(latest) == wanted and latest['XauXat iOS']['id'] == int(rid)
          count = 0
          for r in latest.values():
              assert r['head_sha'] == run['head_sha'] and r['status'] == 'completed' and r['conclusion'] == 'success'
              jobs = api('actions/runs/' + str(r['id']) + '/jobs?filter=all&per_page=100')['jobs']
              jobs = list({j['name']:j for j in sorted(jobs,key=lambda j:j['id'])}.values())
              assert jobs and all(j['status'] == 'completed' and j['conclusion'] in ('success','skipped') for j in jobs)
              count += sum(j['conclusion'] == 'success' for j in jobs)
          assert count >= 24
          proof = dict(source_sha=source, tested_commit=tested, tested_tree=tree, native_core_run=int(rid),
                       validated_runs={k:v['id'] for k,v in latest.items()}, checks_passed=count,
                       workflow_sha=os.environ['GITHUB_SHA'], merged_pr=int(number), core_artifact=core['name'])
          (Path(os.environ['RUNNER_TEMP']) / 'testflight-source.json').write_text(json.dumps(proof,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('source_sha=' + source + '\nartifact_name=' + core['name'] + '\n')
          print(json.dumps(proof))
          PYPROOF

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Download native core from the verified tree
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_CORE_RUN_ID: ${{ inputs.native_core_run_id }}
          CORE_ARTIFACT: ${{ steps.source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          gh run download "$NATIVE_CORE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$CORE_ARTIFACT" --dir .xauxat-cache/ios-libs
          unzip -tq .xauxat-cache/ios-libs/pkg-ios-aarch64-swift-json.zip

      - name: Install distribution certificate and App Store profiles
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_NSE_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_NSE_APPSTORE_PROFILE_BASE64 }}
          IOS_SHARE_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_APPSTORE_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${IOS_DISTRIBUTION_P12_BASE64:?Missing distribution certificate secret}"
          : "${IOS_DISTRIBUTION_P12_PASSWORD:?Missing certificate password secret}"
          keychain="$RUNNER_TEMP/xauxat-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          python3 - <<'PY'
          import base64, os, plistlib, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'xauxat-distribution.p12').write_bytes(base64.b64decode(os.environ['IOS_DISTRIBUTION_P12_BASE64'], validate=True))
          profiles = Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          profiles.mkdir(parents=True, exist_ok=True)
          entries = (
              ('IOS_APPSTORE_PROFILE_BASE64', 'pt.exsoria.xauxat', 'XAUXAT_MAIN_PROFILE'),
              ('IOS_NSE_APPSTORE_PROFILE_BASE64', 'pt.exsoria.xauxat.notification-service', 'XAUXAT_NSE_PROFILE'),
              ('IOS_SHARE_APPSTORE_PROFILE_BASE64', 'pt.exsoria.xauxat.share', 'XAUXAT_SHARE_PROFILE'),
          )
          for secret, bundle_id, variable in entries:
              data = base64.b64decode(os.environ[secret], validate=True)
              raw = temp / (variable + '.mobileprovision')
              raw.write_bytes(data)
              decoded = subprocess.check_output(['security', 'cms', '-D', '-i', str(raw)], stderr=subprocess.DEVNULL)
              profile = plistlib.loads(decoded)
              entitlements = profile['Entitlements']
              assert entitlements['application-identifier'] == os.environ['XAUXAT_DEVELOPMENT_TEAM'] + '.' + bundle_id, 'Profile belongs to a different app/team'
              assert not entitlements.get('get-task-allow', False), 'Distribution profile must not allow debugging'
              assert 'ProvisionedDevices' not in profile and not profile.get('ProvisionsAllDevices', False), 'An App Store profile is required'
              if bundle_id == 'pt.exsoria.xauxat':
                  assert entitlements.get('aps-environment') == 'production', 'App profile needs production APNs'
              if bundle_id.endswith('.notification-service'):
                  assert entitlements.get('com.apple.developer.usernotifications.filtering') is True, 'NSE profile needs filtering'
              uuid = profile['UUID']
              import uuid as uuid_module
              uuid_module.UUID(uuid)
              (profiles / (uuid + '.mobileprovision')).write_bytes(data)
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(variable + '=' + uuid + '\n')
          PY
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/xauxat-distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution'

      - name: Prepare App Store Connect authentication for requested upload
        if: inputs.upload
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          : "${APP_STORE_CONNECT_KEY_P8:?Missing App Store Connect API key}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing API key ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing issuer ID}"
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" > "$RUNNER_TEMP/xauxat-appstore-connect.p8"
          echo "APP_STORE_CONNECT_KEY_PATH=$RUNNER_TEMP/xauxat-appstore-connect.p8" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Verify the requested build number is unused in App Store Connect
        if: inputs.upload
        run: python3 scripts/ios/testflight-status.py preflight --build "$XAUXAT_BUILD_NUMBER" --output "$RUNNER_TEMP/testflight-preflight.json"

      - name: Archive, verify and optionally upload
        env:
          UPLOAD_REQUESTED: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          args=(--team-id "$XAUXAT_DEVELOPMENT_TEAM" --native-core-archive-dir .xauxat-cache/ios-libs)
          if [[ "$UPLOAD_REQUESTED" == true ]]; then args+=(--upload); fi
          ./scripts/ios/archive-testflight.sh "${args[@]}"

      - name: Save verified distribution output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: XauXat-TestFlight-${{ inputs.build_number }}-${{ steps.source.outputs.source_sha }}
          path: .xauxat-release/**/*.ipa
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Wait for Apple processing and enable the existing internal group
        if: inputs.upload
        timeout-minutes: 45
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python3 - <<'PYPUBLISH'
          import json, os, runpy
          from pathlib import Path
          module = runpy.run_path('scripts/ios/testflight-status.py')
          notes = Path('docs/xauxat/TESTFLIGHT_NOTES.txt').read_text().strip()
          assert 0 < len(notes) <= 4000
          api = module['Apple']()
          result = module['publish_internal'](api, module['wait_ready'](api, int(os.environ['XAUXAT_BUILD_NUMBER']), timeout=2400), notes)
          result.update(source_sha=os.environ['SOURCE_SHA'], workflow_sha=os.environ['GITHUB_SHA'])
          (Path(os.environ['RUNNER_TEMP']) / 'testflight-ready.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PYPUBLISH

      - name: Save App Store verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && inputs.upload
        with:
          name: XauXat-TestFlight-receipt-${{ inputs.build_number }}-${{ steps.source.outputs.source_sha }}
          path: ${{ runner.temp }}/testflight-*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/xauxat-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/xauxat-distribution.p12" "$RUNNER_TEMP/xauxat-appstore-connect.p8"
          rm -f "$RUNNER_TEMP"/XAUXAT_*_PROFILE.mobileprovision
          for profile in "${XAUXAT_MAIN_PROFILE:-}" "${XAUXAT_NSE_PROFILE:-}" "${XAUXAT_SHARE_PROFILE:-}"; do
            if [[ "$profile" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile.mobileprovision"
            fi
          done
