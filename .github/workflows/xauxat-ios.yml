name: XauXat iOS

on:
  pull_request:
    paths:
      - apps/ios/**
      - src/**
      - simplex-chat.cabal
      - cabal.project
      - flake.nix
      - flake.lock
      - scripts/nix/**
      - scripts/ios/**
      - scripts/xauxat/**
      - .github/workflows/xauxat-ios.yml
  push:
    branches:
      - xauxat/main
    paths:
      - apps/ios/**
      - src/**
      - simplex-chat.cabal
      - cabal.project
      - flake.nix
      - flake.lock
      - scripts/nix/**
      - scripts/ios/**
      - scripts/xauxat/**
      - .github/workflows/xauxat-ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xauxat-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: XauXat native core (arm64)
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out fork and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Restore XauXat native core archive
        id: native-core-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .xauxat-cache/native-core
          key: xauxat-ios-native-core-${{ hashFiles('src/**', 'simplex-chat.cabal', 'cabal.project', 'flake.nix', 'flake.lock', 'scripts/nix/**') }}

      - name: Install Nix
        if: steps.native-core-cache.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=

      - name: Build native core from this fork
        if: steps.native-core-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          nix --extra-experimental-features 'nix-command flakes' build \
            '.#hydraJobs.aarch64-darwin."aarch64-darwin-ios:lib:simplex-chat"' \
            --accept-flake-config \
            --out-link result-ios-core
          mkdir -p .xauxat-cache/native-core
          cp result-ios-core/pkg-ios-aarch64-swift-json.zip .xauxat-cache/native-core/
          unzip -tq .xauxat-cache/native-core/pkg-ios-aarch64-swift-json.zip

      - name: Upload native core archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: XauXat-iOS-Native-Core-${{ github.sha }}
          path: .xauxat-cache/native-core/pkg-ios-aarch64-swift-json.zip
          if-no-files-found: error
          retention-days: 14

  device:
    name: Latest iOS device (arm64)
    runs-on: macos-26
    timeout-minutes: 60
    needs: native-core

    steps:
      - name: Check out fork and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Record Apple toolchain
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify notification extension Tor policy
        run: ./scripts/ios/verify-nse-tor-policy.sh

      - name: Verify notification acceptance matrix coverage
        run: ./scripts/ios/validate-notification-matrix.sh --allow-pending docs/xauxat/ios-notification-test-matrix.json

      - name: Verify notification privacy policy
        run: ./scripts/ios/verify-notification-privacy-policy.sh

      - name: Download XauXat native core archive
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: XauXat-iOS-Native-Core-${{ github.sha }}
          path: .xauxat-cache/ios-libs

      - name: Prepare native libraries
        run: ./scripts/xauxat/prepare-ios-libs.sh --archive-dir .xauxat-cache/ios-libs --device-only --local-build

      - name: Install pinned Tor dependency
        run: |
          test "$(pod --version)" = "1.17.0"
          pod install --project-directory=apps/ios --deployment

      - name: Build unsigned latest iOS device app
        run: |
          xcodebuild \
            -workspace apps/ios/SimpleX.xcworkspace \
            -scheme "SimpleX (iOS)" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/XauXatDerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify arm64 app and embedded Tor
        run: |
          app_path="$RUNNER_TEMP/XauXatDerivedData/Build/Products/Debug-iphoneos/SimpleX.app"
          test -d "$app_path"
          test -f "$app_path/SimpleX"
          test -f "$app_path/Frameworks/Tor.framework/Tor"
          file "$app_path/SimpleX" | grep -q 'arm64'
          file "$app_path/Frameworks/Tor.framework/Tor" | grep -q 'arm64'
          test "$(plutil -extract CFBundleDisplayName raw "$app_path/Info.plist")" = "XauXat"
          xcrun vtool -show-build "$app_path/SimpleX" | grep -q 'platform IOS'
          xcrun vtool -show-build "$app_path/Frameworks/Tor.framework/Tor" | grep -q 'platform IOS'
          otool -L "$app_path/SimpleX" | grep -q '@rpath/Tor.framework/Tor'
          ./scripts/ios/verify-xauxat-identifiers.sh "$app_path" development

      - name: Upload arm64 device app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: XauXat-iOS-Device-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/XauXatDerivedData/Build/Products/Debug-iphoneos/*.app
          if-no-files-found: error
          retention-days: 14

  simulator:
    name: Latest iOS Simulator (arm64 launch)
    runs-on: macos-26
    timeout-minutes: 75
    needs: native-core

    steps:
      - name: Check out fork and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Record Apple toolchain
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Verify notification extension Tor policy
        run: ./scripts/ios/verify-nse-tor-policy.sh

      - name: Verify notification acceptance matrix coverage
        run: ./scripts/ios/validate-notification-matrix.sh --allow-pending docs/xauxat/ios-notification-test-matrix.json

      - name: Verify notification privacy policy
        run: ./scripts/ios/verify-notification-privacy-policy.sh

      - name: Download XauXat native core archive
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: XauXat-iOS-Native-Core-${{ github.sha }}
          path: .xauxat-cache/ios-libs

      - name: Prepare pinned arm64 simulator libraries
        run: ./scripts/xauxat/prepare-ios-libs.sh --archive-dir .xauxat-cache/ios-libs --local-build

      - name: Install pinned Tor dependency
        run: |
          test "$(pod --version)" = "1.17.0"
          pod install --project-directory=apps/ios --deployment

      - name: Boot latest available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime_id=$(xcrun simctl list runtimes available --json | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["name"].startswith("iOS")]
          runtime = max(runtimes, key=lambda r: tuple(int(p) for p in r["version"].split(".")))
          print(runtime["identifier"])
          ')
          device_type_id=$(xcrun simctl list devicetypes --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devicetypes"]
          preferred = ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 15 Pro"]
          by_name = {d["name"]: d["identifier"] for d in devices}
          selected = next((by_name[name] for name in preferred if name in by_name), None)
          if selected is None:
              selected = next(d["identifier"] for d in reversed(devices) if d["name"].startswith("iPhone"))
          print(selected)
          ')
          simulator_id=$(xcrun simctl create XauXat-CI "$device_type_id" "$runtime_id")
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "udid=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build signed arm64 simulator app
        run: |
          xcodebuild \
            -workspace apps/ios/SimpleX.xcworkspace \
            -scheme "SimpleX (iOS)" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/XauXatSimulatorDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Verify, install and launch on simulator
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/XauXatSimulatorDerivedData/Build/Products/Debug-iphonesimulator/SimpleX.app"
          app_binary="$app_path/SimpleX"
          tor_binary="$app_path/Frameworks/Tor.framework/Tor"
          test -d "$app_path"
          test "$(plutil -extract CFBundleDisplayName raw "$app_path/Info.plist")" = "XauXat"
          ./scripts/ios/verify-xauxat-identifiers.sh "$app_path" development
          file "$app_binary" | grep -q 'arm64'
          file "$tor_binary" | grep -q 'arm64'
          xcrun vtool -show-build "$app_binary" | grep -q 'platform IOSSIMULATOR'
          xcrun vtool -show-build "$tor_binary" | grep -q 'platform IOSSIMULATOR'
          xcrun simctl install '${{ steps.simulator.outputs.udid }}' "$app_path"
          launch_result=$(xcrun simctl launch '${{ steps.simulator.outputs.udid }}' pt.exsoria.xauxat)
          app_pid=${launch_result##*: }
          test -n "$app_pid"
          for attempt in $(seq 1 12); do
            sleep 5
            kill -0 "$app_pid"
          done
          xcrun simctl io '${{ steps.simulator.outputs.udid }}' screenshot "$RUNNER_TEMP/XauXat-Simulator.png"

      - name: Upload runnable arm64 simulator app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: XauXat-iOS-Simulator-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/XauXatSimulatorDerivedData/Build/Products/Debug-iphonesimulator/SimpleX.app
            ${{ runner.temp }}/XauXat-Simulator.png
          if-no-files-found: error
          retention-days: 14
