name: XauXat expression validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expressions:
    name: Private stickers and soundboard
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash scripts/ios/test-expressions.sh
        env:
          EXPRESSION_TEST_OUTPUT: ${{ runner.temp }}/expressions-proof
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: XauXat-expressions-${{ github.sha }}
          path: ${{ runner.temp }}/expressions-proof
          if-no-files-found: error
          retention-days: 7

