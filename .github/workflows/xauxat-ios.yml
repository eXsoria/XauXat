name: XauXat voice layout ARM verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-recording:
    name: Voice recording gestures and AAC preview
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash scripts/ios/test-voice-recording.sh
        env:
          VOICE_TEST_OUTPUT: ${{ runner.temp }}/voice-recording-proof
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: XauXat-voice-recording-${{ github.sha }}
          path: ${{ runner.temp }}/voice-recording-proof
          if-no-files-found: error
          retention-days: 7

