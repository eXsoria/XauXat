name: XauXat voice diagnostics 2
on:
  push:
    branches: [xauxat/voice-ci-diagnostics-2]
permissions:
  contents: read
concurrency:
  group: xauxat-voice-diagnostics-2
  cancel-in-progress: true
jobs:
  voice:
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash scripts/ios/test-voice-recording.sh
        env:
          VOICE_TEST_TRACE: '1'
          VOICE_TEST_OUTPUT: ${{ runner.temp }}/voice-diagnostics-2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: XauXat-voice-diagnostics-2-${{ github.sha }}
          path: ${{ runner.temp }}/voice-diagnostics-2
          if-no-files-found: error
          retention-days: 7
