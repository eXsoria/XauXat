name: xauxat-support
services:
  support:
    build: .
    image: xauxat-support:local
    restart: unless-stopped
    env_file: .env
    ports:
      - 127.0.0.1:8787:8080
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.20
    pids_limit: 48
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: '2'
